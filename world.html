<!-- Load Three.js then run the world -->
<script>
// ── Load Three.js dynamically then boot ──────────────────────
(function(){
  // Progress bar
  let pct=0;
  const lbar=document.getElementById('lbar');
  const barTick=setInterval(()=>{
    pct=Math.min(pct+(Math.random()*3),85);
    if(lbar) lbar.style.width=pct+'%';
  },80);

  const s=document.createElement('script');
  s.src='https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js';
  s.onload=function(){
    clearInterval(barTick);
    if(lbar){ lbar.style.width='100%'; }
    setTimeout(function(){ try{ initWorld(); } catch(e){ showErr(e.message); } }, 300);
  };
  s.onerror=function(){ clearInterval(barTick); showErr('Failed to load 3D engine. Refresh to retry.'); };
  document.head.appendChild(s);

  function showErr(msg){
    var el=document.getElementById('lerr');
    if(el){ el.style.display='block'; el.textContent=msg; }
  }
})();

function dismissLoader(){
  const ldr=document.getElementById('loader');
  if(!ldr) return;
  ldr.style.opacity='0';
  setTimeout(()=>{ ldr.style.display='none'; },1600);
  const hud=document.getElementById('hud');
  if(hud) hud.style.opacity='1';
}


function startWorld(){
  try { initWorld(); }
  catch(e){
    console.error('World init error:', e);
    document.getElementById('lerr').style.display='block';
    document.getElementById('lerr').textContent = 'Init error: ' + e.message;
    // Still dismiss loader so user sees the error
    dismissLoader();
  }
}



// ============================================================
//  WORLD ENGINE
// ============================================================
const ZONES = [
  {name:'THE CATHEDRAL',        desc:'Heart of the sovereign dimension',     px:0,   py:0, pz:0},
  {name:'OLYMPUS CHAMBER',      desc:'Where the Five Biotics convene',       px:-60, py:8, pz:-60},
  {name:'THE NEURO GRID',       desc:'D8 frequency nexus · Living data',     px:60,  py:4, pz:-60},
  {name:'GARDEN OF FIVE PILLARS',desc:'Trust · Will · Love · Imagination',  px:0,   py:2, pz:80},
  {name:'AKASHIC OBSERVATORY',  desc:'All records · Press [L] to enter',     px:0,   py:50,pz:0},
];

let renderer, scene, fpCam, tpCam, cam, clock;
let pivot, pov='fp';
let velF=0, velR=0, velY=0;
let yaw=0, pitch=0;
let lmb=false, rmb=false;
let keys={w:0,s:0,a:0,d:0};
let mx=0, my=0;
let orbRings=[], spinners=[], pillarGlow=[];
let catBeam=null, driftAttr=null, driftN=0;
let curZone=0, lastZoneT=0, freqV=4.2;
let mmCtx;
let audioCtx=null, masterGain=null, sndOn=false;

// Avatar
let avatar=null;

function initWorld(){
  // Renderer
  const canvas = document.getElementById('c');
  renderer = new THREE.WebGLRenderer({canvas, antialias:true, powerPreference:'high-performance'});
  renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
  renderer.setSize(innerWidth, innerHeight);
  renderer.toneMapping = THREE.ACESFilmicToneMapping;
  renderer.toneMappingExposure = 1.15;
  renderer.shadowMap.enabled = true;

  scene = new THREE.Scene();
  scene.fog = new THREE.FogExp2(0x04010e, 0.006);
  clock = new THREE.Clock();

  // Cameras
  fpCam = new THREE.PerspectiveCamera(72, innerWidth/innerHeight, 0.1, 2000);
  tpCam = new THREE.PerspectiveCamera(60, innerWidth/innerHeight, 0.1, 2000);
  cam = fpCam;

  // Player
  pivot = new THREE.Object3D();
  pivot.position.set(0, 4, 28);
  scene.add(pivot);
  pivot.add(fpCam);
  fpCam.position.set(0, 0, 0);

  buildScene();
  buildAvatar();
  buildLights();
  buildStars();
  buildNebula();
  buildDrift();

  mmCtx = document.getElementById('mmc').getContext('2d');

  // Events
  window.addEventListener('resize', ()=>{
    fpCam.aspect = tpCam.aspect = innerWidth/innerHeight;
    fpCam.updateProjectionMatrix(); tpCam.updateProjectionMatrix();
    renderer.setSize(innerWidth, innerHeight);
  });
  document.addEventListener('mousemove', e=>{
    mx = (e.clientX/innerWidth - 0.5)*2;
    my = (e.clientY/innerHeight - 0.5)*2;
    if(pov==='fp'){
      yaw   -= e.movementX * 0.0018;
      pitch -= e.movementY * 0.0018;
      pitch  = Math.max(-1.1, Math.min(1.1, pitch));
    }
  });
  document.addEventListener('mousedown', e=>{ if(e.button===0) lmb=true; if(e.button===2) rmb=true; });
  document.addEventListener('mouseup',   e=>{ if(e.button===0) lmb=false; if(e.button===2) rmb=false; });
  document.addEventListener('contextmenu', e=>e.preventDefault());
  document.addEventListener('wheel', e=>{ velY -= e.deltaY*0.003; velY=Math.max(-15,Math.min(15,velY)); });
  document.addEventListener('keydown', e=>{
    if(e.code==='KeyW'||e.code==='ArrowUp')    keys.w=1;
    if(e.code==='KeyS'||e.code==='ArrowDown')  keys.s=1;
    if(e.code==='KeyA'||e.code==='ArrowLeft')  keys.a=1;
    if(e.code==='KeyD'||e.code==='ArrowRight') keys.d=1;
    if(e.code==='KeyL') window.open('akashic','_blank');
  });
  document.addEventListener('keyup', e=>{
    if(e.code==='KeyW'||e.code==='ArrowUp')    keys.w=0;
    if(e.code==='KeyS'||e.code==='ArrowDown')  keys.s=0;
    if(e.code==='KeyA'||e.code==='ArrowLeft')  keys.a=0;
    if(e.code==='KeyD'||e.code==='ArrowRight') keys.d=0;
  });

  // Freq ticker
  setInterval(()=>{
    freqV += (Math.random()-.5)*.25;
    freqV = Math.max(1, Math.min(7, freqV));
    document.getElementById('freqd').innerHTML = 'D8: '+freqV.toFixed(1)+' · <span id="mvst">'+document.getElementById('mvst').textContent+'</span>';
  }, 1200);

  dismissLoader();
  animate();
}

// ── SCENE ────────────────────────────────────────────────────
function buildScene(){
  // Ground
  const gnd = new THREE.Mesh(
    new THREE.PlaneGeometry(700,700),
    new THREE.MeshStandardMaterial({color:0x06041a, roughness:0.9, metalness:0.05})
  );
  gnd.rotation.x=-Math.PI/2; gnd.receiveShadow=true; scene.add(gnd);
  const grid = new THREE.GridHelper(700,70, 0xd4af37, 0x120920);
  grid.material.opacity=0.18; grid.material.transparent=true; scene.add(grid);

  // ── ZONE 1: CATHEDRAL ─────────────────────────────────────
  const cat = new THREE.Group(); scene.add(cat);
  // Marble platform
  cat.add(mbox(36,3,36, 0,0,0, 0xede8de, 0.5, 0.05));
  // Gold columns
  const catColPos=[[-13,0,-13],[13,0,-13],[-13,0,13],[13,0,13],[-13,0,0],[13,0,0],[0,0,-13],[0,0,13]];
  catColPos.forEach(p=>{ const c=column(1.3,16,0xf0ece0,0xd4af37); c.position.set(p[0],1.5,p[2]); cat.add(c); });
  // Spire
  const sp=new THREE.Mesh(new THREE.CylinderGeometry(0.12,2.1,44,8), stdMat(0xd4af37,0xd4af37,0.9,1,0.05));
  sp.position.y=24; cat.add(sp);
  // D9 Beam
  catBeam=new THREE.Mesh(new THREE.CylinderGeometry(0.6,0.6,240,8,1,true), new THREE.MeshBasicMaterial({color:0xffd700,transparent:true,opacity:0.16,side:THREE.DoubleSide}));
  catBeam.position.y=124; cat.add(catBeam);
  // Orbital rings
  [[1.5,0.22],[2.1,0.18],[2.85,0.14]].forEach(([sc,th],i)=>{
    const r=new THREE.Mesh(new THREE.TorusGeometry(18*sc,th,8,90), stdMat(0xd4af37,0xd4af37,0.85,1,0.05));
    r.position.y=10+i*10; r.rotation.x=Math.PI/3+i*0.3; r.rotation.z=i*0.6; cat.add(r);
    orbRings.push({m:r, spd:0.0016*(i+1)});
  });
  // Tip light
  const tl=new THREE.PointLight(0xffd700,5,90); tl.position.y=44; cat.add(tl);
  bridge([0,0,28],[0,0,0]);

  // ── ZONE 2: OLYMPUS ────────────────────────────────────────
  const oly=island(-60,8,-60,28,0xf5e8c0);
  for(let i=0;i<12;i++){
    const a=(i/12)*Math.PI*2;
    const c=column(0.85,13,0xf5f0e8,0xe8c870); c.position.set(Math.cos(a)*12,1.5,Math.sin(a)*12); oly.add(c);
  }
  // Ceiling
  const ceilM=new THREE.Mesh(new THREE.CircleGeometry(12,64), new THREE.MeshBasicMaterial({color:0x04021a,side:THREE.DoubleSide,transparent:true,opacity:0.88}));
  ceilM.rotation.x=-Math.PI/2; ceilM.position.y=14; oly.add(ceilM);
  for(let i=0;i<55;i++){
    const a=Math.random()*Math.PI*2, r=Math.random()*10.5;
    const s=new THREE.Mesh(new THREE.SphereGeometry(0.09,4,4), new THREE.MeshBasicMaterial({color:0xffffff}));
    s.position.set(Math.cos(a)*r,14,Math.sin(a)*r); oly.add(s);
  }
  bridge([-60,8,-60],[0,0,0]);

  // ── ZONE 3: NEURO GRID ─────────────────────────────────────
  const neu=island(60,4,-60,24,0x9080ee);
  for(let i=0;i<6;i++){
    const a=(i/6)*Math.PI*2;
    const c=column(0.8,12,0xd0c8ff,0x7b68ee); c.position.set(Math.cos(a)*10,1.5,Math.sin(a)*10); neu.add(c);
  }
  const ng=new THREE.GridHelper(22,12,0x7b68ee,0x2d1a5e);
  ng.position.y=0.5; ng.material.transparent=true; ng.material.opacity=0.5; neu.add(ng);
  const orb=new THREE.Mesh(new THREE.IcosahedronGeometry(2.4,1), new THREE.MeshBasicMaterial({color:0x7b68ee,wireframe:true}));
  orb.position.y=5; neu.add(orb); spinners.push({m:orb,spd:0.012});
  bridge([60,4,-60],[0,0,0]);

  // ── ZONE 4: GARDEN ─────────────────────────────────────────
  const gar=island(0,2,80,34,0x60aa58);
  const PCOL=[0xd4af37,0x9080ff,0xff7080,0x80ff90,0xff80c0];
  const PPOS=[[-13,0,0],[-6.5,0,-10],[0,0,0],[6.5,0,-10],[13,0,0]];
  PCOL.forEach((pc,i)=>{
    const pg=new THREE.Mesh(new THREE.CylinderGeometry(0.9,0.9,22,10), stdMat(pc,pc,0.55,0.5,0.3));
    pg.position.set(PPOS[i][0],11,PPOS[i][2]); gar.add(pg);
    pillarGlow.push({m:pg, base:0.55, ph:i*1.3});
    const cap=new THREE.Mesh(new THREE.SphereGeometry(1.4,16,16), stdMat(pc,pc,1.0,0.4,0.3));
    cap.position.set(PPOS[i][0],22.5,PPOS[i][2]); gar.add(cap);
  });
  for(let i=0;i<10;i++){
    const a=(i/10)*Math.PI*2;
    const tr=new THREE.Mesh(new THREE.CylinderGeometry(0.22,0.3,5,6), stdMat(0x8B6914,0x4a3000,0.2,0.3,0.8));
    tr.position.set(Math.cos(a)*22,2.5,Math.sin(a)*22); gar.add(tr);
    const lf=new THREE.Mesh(new THREE.SphereGeometry(3,8,8), stdMat(0xd4af37,0x7a5000,0.4,0.3,0.7));
    lf.material.transparent=true; lf.material.opacity=0.85;
    lf.position.set(Math.cos(a)*22,7,Math.sin(a)*22); gar.add(lf);
  }
  bridge([0,2,80],[0,0,0]);

  // ── ZONE 5: OBSERVATORY ────────────────────────────────────
  const obs=new THREE.Group(); obs.position.set(0,50,0); scene.add(obs);
  obs.add(mbox(0,0,0, 0,0,0, 0x0c0820, 0.25, 0.9, true, 28)); // cylinder via mbox won't work - use mesh
  const obBase=new THREE.Mesh(new THREE.CylinderGeometry(16,17,4,32), stdMat(0x0c0820,0x040212,0.06,0.9,0.2));
  obs.add(obBase);
  const dome=new THREE.Mesh(new THREE.SphereGeometry(14,32,16,0,Math.PI*2,0,Math.PI/2), new THREE.MeshStandardMaterial({color:0x87ceeb,transparent:true,opacity:0.12,metalness:1,roughness:0,side:THREE.DoubleSide}));
  dome.position.y=2; obs.add(dome);
  const gx=new THREE.Mesh(new THREE.SphereGeometry(6,16,16), new THREE.MeshBasicMaterial({color:0x3a0a6e,transparent:true,opacity:0.8}));
  gx.position.y=8; obs.add(gx); spinners.push({m:gx,spd:0.004});
  const gr=new THREE.Mesh(new THREE.TorusGeometry(8,0.6,8,70), stdMat(0x9932cc,0x9932cc,0.9,1,0));
  gr.position.y=8; gr.rotation.x=Math.PI/2; obs.add(gr); spinners.push({m:gr,spd:0.009});
  for(let i=0;i<8;i++){
    const a=(i/8)*Math.PI*2;
    const c=column(0.7,12,0xc0d8ff,0x87ceeb); c.position.set(Math.cos(a)*13,2,Math.sin(a)*13); obs.add(c);
  }
  // Vertical beam
  const vb=new THREE.Mesh(new THREE.CylinderGeometry(0.12,0.12,50,8), new THREE.MeshBasicMaterial({color:0xd4af37,transparent:true,opacity:0.15}));
  vb.position.set(0,25,0); scene.add(vb);
}

// ── Helpers ──────────────────────────────────────────────────
function stdMat(col,em,emI,met,rou){
  return new THREE.MeshStandardMaterial({color:col,emissive:em||col,emissiveIntensity:emI||0,metalness:met||0.5,roughness:rou||0.4});
}
function mbox(w,h,d, x,y,z, col,rou,met){
  const m=new THREE.Mesh(new THREE.BoxGeometry(w,h,d), new THREE.MeshStandardMaterial({color:col,roughness:rou||0.5,metalness:met||0.1}));
  m.position.set(x,y,z); m.receiveShadow=true; m.castShadow=true; return m;
}
function island(x,y,z,sz,accent){
  const g=new THREE.Group(); g.position.set(x,y,z); scene.add(g);
  const top=new THREE.Mesh(new THREE.CylinderGeometry(sz,sz*.96,2.2,24), new THREE.MeshStandardMaterial({color:0xede8de,roughness:0.5,metalness:0.05}));
  top.receiveShadow=true; g.add(top);
  const under=new THREE.Mesh(new THREE.CylinderGeometry(sz*.9,sz*.5,5,24), new THREE.MeshStandardMaterial({color:0x060412,roughness:0.4,metalness:0.6}));
  under.position.y=-3.5; g.add(under);
  const rim=new THREE.Mesh(new THREE.TorusGeometry(sz,0.24,8,80), stdMat(accent,accent,0.45,1,0.06));
  rim.rotation.x=Math.PI/2; rim.position.y=1.1; g.add(rim);
  const gl=new THREE.PointLight(accent,1.2,sz*3); gl.position.y=-2; g.add(gl);
  return g;
}
function column(r,h,sc,cc){
  const g=new THREE.Group();
  const sm=new THREE.MeshStandardMaterial({color:sc,roughness:0.5,metalness:0.08});
  const cm=new THREE.MeshStandardMaterial({color:cc,roughness:0.2,metalness:0.7,emissive:cc,emissiveIntensity:0.15});
  g.add(new THREE.Mesh(new THREE.CylinderGeometry(r*1.5,r*1.5,r*.55,16),sm));
  const sh=new THREE.Mesh(new THREE.CylinderGeometry(r*.9,r,h,16),sm); sh.position.y=h/2+r*.28; g.add(sh);
  const cap=new THREE.Mesh(new THREE.CylinderGeometry(r*1.6,r*.9,r*.9,16),cm); cap.position.y=h+r*.72; g.add(cap);
  const ab=new THREE.Mesh(new THREE.BoxGeometry(r*3.2,r*.44,r*3.2),cm); ab.position.y=h+r*1.16; g.add(ab);
  return g;
}
function bridge(a,b){
  const s=new THREE.Vector3(...a), e=new THREE.Vector3(...b), d=new THREE.Vector3().subVectors(e,s);
  const m=new THREE.Mesh(new THREE.CylinderGeometry(0.06,0.06,d.length(),8), new THREE.MeshBasicMaterial({color:0xd4af37,transparent:true,opacity:0.18}));
  m.position.copy(new THREE.Vector3().addVectors(s,e).multiplyScalar(.5));
  m.quaternion.setFromUnitVectors(new THREE.Vector3(0,1,0),d.normalize()); scene.add(m);
}

// ── LIGHT BODY AVATAR ─────────────────────────────────────────
function buildAvatar(){
  avatar=new THREE.Group(); scene.add(avatar);
  function glow(r,col,op,x,y,z){
    const m=new THREE.Mesh(new THREE.SphereGeometry(r,12,12), new THREE.MeshBasicMaterial({color:col,transparent:true,opacity:op,blending:THREE.AdditiveBlending,depthWrite:false}));
    m.position.set(x||0,y||0,z||0); return m;
  }
  // Core layers
  avatar.add(glow(0.18,0xffffff,0.95));
  avatar.add(glow(0.45,0xe8d8ff,0.55));
  avatar.add(glow(0.9,0xb090ff,0.28));
  avatar.add(glow(1.6,0x7b68ee,0.12));
  // Head
  const head=new THREE.Group(); head.position.y=1.85; avatar.add(head);
  head.add(glow(0.22,0xffffff,1.0)); head.add(glow(0.42,0xffd700,0.65));
  head.add(glow(0.75,0xd4af37,0.30)); head.add(glow(1.1,0x7b68ee,0.12));
  // Torso
  const torso=new THREE.Group(); avatar.add(torso);
  [[1.6,0.55,0.45,0xffffff,0.45],[2.1,0.85,0.7,0xd4c8ff,0.22],[2.6,1.2,0.9,0x9080d0,0.12]].forEach(([sy,sx,sz,col,op])=>{
    const m=new THREE.Mesh(new THREE.SphereGeometry(1,10,10), new THREE.MeshBasicMaterial({color:col,transparent:true,opacity:op,blending:THREE.AdditiveBlending,depthWrite:false}));
    m.scale.set(sx,sy,sz); torso.add(m);
  });
  // Arms
  [[-0.8,0.4],[0.8,0.4]].forEach(([ax,ay])=>{
    avatar.add(glow(0.14,0xffffff,0.8,ax,ay,0)); avatar.add(glow(0.3,0xd4af37,0.45,ax,ay,0)); avatar.add(glow(0.55,0x7b68ee,0.18,ax,ay,0));
  });
  // Legs
  [[-0.32,-1.5],[0.32,-1.5]].forEach(([lx,ly])=>{
    const lg=new THREE.Group(); lg.position.set(lx,ly,0); avatar.add(lg);
    [[1.1,0.22,0xffffff,0.55],[1.5,0.38,0x9080ff,0.25],[1.8,0.55,0x6050cc,0.12]].forEach(([sy,sx,col,op])=>{
      const m=new THREE.Mesh(new THREE.SphereGeometry(1,8,8), new THREE.MeshBasicMaterial({color:col,transparent:true,opacity:op,blending:THREE.AdditiveBlending,depthWrite:false}));
      m.scale.set(sx,sy,sx); lg.add(m);
    });
  });
  // Outer aura
  avatar.add(new THREE.Mesh(new THREE.SphereGeometry(2.6,16,16), new THREE.MeshBasicMaterial({color:0x7b68ee,transparent:true,opacity:0.06,blending:THREE.AdditiveBlending,depthWrite:false,side:THREE.BackSide})));

  // Trail particles
  const tGeo=new THREE.BufferGeometry(), tN=40;
  const tPos=new Float32Array(tN*3).fill(0);
  tGeo.setAttribute('position',new THREE.BufferAttribute(tPos,3));
  avatar._trail={mesh:new THREE.Points(tGeo,new THREE.PointsMaterial({size:0.2,color:0xd4af37,transparent:true,opacity:0,blending:THREE.AdditiveBlending,depthWrite:false})),attr:tGeo.attributes.position,hist:[],n:tN};
  scene.add(avatar._trail.mesh);
}

function updateAvatar(t, moving){
  if(!avatar) return;
  avatar.visible=(pov==='tp');
  avatar._trail.mesh.visible=(pov==='tp');
  if(pov!=='tp') return;
  avatar.position.copy(pivot.position);
  avatar.position.y+=Math.sin(t*1.2)*0.18-0.5;
  avatar.rotation.y=yaw;
  avatar.rotation.x=moving?-0.1:0;
  // Core pulse
  if(avatar.children[0]) avatar.children[0].scale.setScalar(1+Math.sin(t*2.2)*0.08);
  // Trail
  const tr=avatar._trail;
  if(moving){ tr.hist.unshift(pivot.position.clone()); if(tr.hist.length>tr.n) tr.hist.pop(); }
  else if(tr.hist.length>0) tr.hist.pop();
  for(let i=0;i<tr.n;i++){
    if(i<tr.hist.length){ const p=tr.hist[i]; tr.attr.array[i*3]=p.x+(Math.random()-.5)*.3; tr.attr.array[i*3+1]=p.y+(Math.random()-.5)*.3; tr.attr.array[i*3+2]=p.z+(Math.random()-.5)*.3; }
    else tr.attr.array[i*3]=tr.attr.array[i*3+1]=tr.attr.array[i*3+2]=0;
  }
  tr.attr.needsUpdate=true;
  tr.mesh.material.opacity=moving?0.45:0;
}

// ── LIGHTS ────────────────────────────────────────────────────
function buildLights(){
  scene.add(new THREE.AmbientLight(0xc0b8e0,1.1));
  const sun=new THREE.DirectionalLight(0xfff8e8,2.4); sun.position.set(60,120,40); sun.castShadow=true; scene.add(sun);
  (function(){const _pl_3784=new THREE.PointLight(0xd4af37,4,280);_pl_3784.position.set(0,40,0);scene.add(_pl_3784); })();
  (function(){const _pl_8971=new THREE.PointLight(0x7b68ee,2.5,350);_pl_8971.position.set(-90,50,-90);scene.add(_pl_8971); })();
  (function(){const _pl_9785=new THREE.PointLight(0x4060ff,2,180);_pl_9785.position.set(60,18,-60);scene.add(_pl_9785); })();
  (function(){const _pl_8395=new THREE.PointLight(0x40cc50,1.6,140);_pl_8395.position.set(0,18,80);scene.add(_pl_8395); })();
  (function(){const _pl_1101=new THREE.PointLight(0x88ccff,2.5,220);_pl_1101.position.set(0,70,0);scene.add(_pl_1101); })();
}

// ── STARS + NEBULA + DRIFT ────────────────────────────────────
function buildStars(){
  const N=4000, geo=new THREE.BufferGeometry(), pos=new Float32Array(N*3), col=new Float32Array(N*3);
  for(let i=0;i<N;i++){
    const r=950+Math.random()*500, t=Math.random()*Math.PI*2, p=Math.acos(2*Math.random()-1);
    pos[i*3]=r*Math.sin(p)*Math.cos(t); pos[i*3+1]=r*Math.sin(p)*Math.sin(t); pos[i*3+2]=r*Math.cos(p);
    const g=Math.random()>.4; col[i*3]=g?.84:.95; col[i*3+1]=g?.70:.95; col[i*3+2]=g?.22:1.0;
  }
  geo.setAttribute('position',new THREE.BufferAttribute(pos,3));
  geo.setAttribute('color',new THREE.BufferAttribute(col,3));
  scene.add(new THREE.Points(geo,new THREE.PointsMaterial({size:1.4,vertexColors:true,transparent:true,opacity:.9})));
}
function buildNebula(){
  [[0x3a0a6e,.08],[0x0a1e6e,.07],[0x6e0a3a,.06],[0x0a3a6e,.07],[0x4a0a8e,.05]].forEach(([col,op],i)=>{
    const m=new THREE.Mesh(new THREE.SphereGeometry(300+i*80,12,12), new THREE.MeshBasicMaterial({color:col,transparent:true,opacity:op,side:THREE.BackSide,blending:THREE.AdditiveBlending}));
    m.position.set((i%3-.5)*280,(i<3?-1:1)*150,0); scene.add(m);
  });
}
function buildDrift(){
  const N=1400, geo=new THREE.BufferGeometry(), pos=new Float32Array(N*3);
  for(let i=0;i<N;i++){ pos[i*3]=(Math.random()-.5)*240; pos[i*3+1]=Math.random()*80; pos[i*3+2]=(Math.random()-.5)*240; }
  geo.setAttribute('position',new THREE.BufferAttribute(pos,3));
  scene.add(new THREE.Points(geo,new THREE.PointsMaterial({size:.38,color:0xd4af37,transparent:true,opacity:.5,blending:THREE.AdditiveBlending,depthWrite:false})));
  driftAttr=geo.attributes.position; driftN=N;
}

// ── MOVEMENT ─────────────────────────────────────────────────
function updateMovement(dt){
  const ACC=14, DRAG=0.06, MAXV=18;
  let tF=0;
  if(lmb||keys.w) tF=ACC;
  if(rmb||keys.s) tF=-ACC*.65;
  velF+=(tF-velF)*(tF!==0?.08:DRAG); velF*=(1-DRAG); velF=Math.max(-MAXV,Math.min(MAXV,velF));
  let tR=0; if(keys.a) tR=-ACC*.6; if(keys.d) tR=ACC*.6;
  velR+=(tR-velR)*.08; velR*=(1-DRAG*1.2);
  velY*=(1-DRAG*.8);
  if(lmb||rmb){ yaw-=mx*.0016*18*dt; pitch-=my*.5*.0016*14*dt; pitch=Math.max(-1.1,Math.min(1.1,pitch)); }
  pivot.rotation.y=yaw; fpCam.rotation.x=pitch;
  const fw=new THREE.Vector3(0,0,-1).applyEuler(new THREE.Euler(0,yaw,0,'YXZ'));
  const rt=new THREE.Vector3(1,0,0).applyEuler(new THREE.Euler(0,yaw,0,'YXZ'));
  pivot.position.addScaledVector(fw,velF*dt);
  pivot.position.addScaledVector(rt,velR*dt);
  pivot.position.y+=velY*dt;
  pivot.position.x=Math.max(-280,Math.min(280,pivot.position.x));
  pivot.position.z=Math.max(-280,Math.min(280,pivot.position.z));
  pivot.position.y=Math.max(0.5,Math.min(120,pivot.position.y));
  const spd=Math.abs(velF)+Math.abs(velR)+Math.abs(velY);
  const el=document.getElementById('mvst');
  if(el) el.textContent=spd>1.5?'GLIDING':spd>0.2?'DRIFTING':'STILL';
  return spd>0.4;
}
function updateTPCam(){
  const off=new THREE.Vector3(0,5,14).applyEuler(new THREE.Euler(0,yaw,0));
  tpCam.position.copy(pivot.position).add(off);
  tpCam.lookAt(pivot.position.clone().add(new THREE.Vector3(0,1,0)));
}

// ── ZONE / MINIMAP ────────────────────────────────────────────
function checkZone(t){
  if(t-lastZoneT<.6) return; lastZoneT=t;
  let ni=0,nd=Infinity;
  ZONES.forEach((z,i)=>{ const d=Math.hypot(pivot.position.x-z.px,pivot.position.z-z.pz); if(d<nd){nd=d;ni=i;} });
  if(ni!==curZone){
    curZone=ni;
    document.getElementById('zname').textContent=ZONES[ni].name;
    document.getElementById('ztn').textContent=ZONES[ni].name;
    document.getElementById('ztd').textContent=ZONES[ni].desc;
    const tip=document.getElementById('ztip'); tip.style.opacity='1';
    setTimeout(()=>tip.style.opacity='0',3200);
  }
}
function drawMM(){
  const W=130,H=130,sc=0.32;
  mmCtx.clearRect(0,0,W,H);
  mmCtx.fillStyle='rgba(4,1,14,.96)'; mmCtx.fillRect(0,0,W,H);
  mmCtx.strokeStyle='rgba(212,175,55,.08)'; mmCtx.lineWidth=.5;
  for(let i=0;i<13;i++){mmCtx.beginPath();mmCtx.moveTo(i*10,0);mmCtx.lineTo(i*10,H);mmCtx.stroke();mmCtx.beginPath();mmCtx.moveTo(0,i*10);mmCtx.lineTo(W,i*10);mmCtx.stroke();}
  ZONES.forEach((z,i)=>{
    const mx=z.px*sc+W/2, my=z.pz*sc+H/2;
    mmCtx.beginPath(); mmCtx.arc(mx,my,5,0,Math.PI*2);
    mmCtx.fillStyle=i===curZone?'#ffd700':'rgba(212,175,55,.4)'; mmCtx.fill();
  });
  const px=pivot.position.x*sc+W/2, py=pivot.position.z*sc+H/2;
  mmCtx.beginPath(); mmCtx.arc(px,py,4,0,Math.PI*2); mmCtx.fillStyle='#fff'; mmCtx.fill();
  mmCtx.beginPath(); mmCtx.moveTo(px,py); mmCtx.lineTo(px+Math.sin(yaw)*8,py+Math.cos(yaw)*8);
  mmCtx.strokeStyle='#fff'; mmCtx.lineWidth=1.5; mmCtx.stroke();
}

// ── SOUND ─────────────────────────────────────────────────────
function toggleSnd(){
  if(!audioCtx) audioCtx=new(window.AudioContext||window.webkitAudioContext)();
  sndOn=!sndOn;
  document.getElementById('sndb').textContent='♪ AMBIENCE: '+(sndOn?'ON':'OFF');
  if(sndOn){
    masterGain=audioCtx.createGain(); masterGain.gain.value=0; masterGain.connect(audioCtx.destination);
    masterGain.gain.setTargetAtTime(.07,audioCtx.currentTime,2.5);
    [108,216,432].forEach((f,i)=>{ const o=audioCtx.createOscillator(),g=audioCtx.createGain(); g.gain.value=.035/(i+1); o.type='sine'; o.frequency.value=f; o.connect(g); g.connect(masterGain); o.start(); });
    const p=audioCtx.createOscillator(),pg=audioCtx.createGain(); pg.gain.value=.016; p.type='triangle'; p.frequency.value=54; p.connect(pg); pg.connect(masterGain); p.start();
  } else if(masterGain){ masterGain.gain.setTargetAtTime(0,audioCtx.currentTime,.6); }
}

// ── POV ───────────────────────────────────────────────────────
function setPOV(m){
  pov=m; cam=m==='fp'?fpCam:tpCam;
  document.getElementById('fpb').style.background=m==='fp'?'rgba(212,175,55,.18)':'rgba(0,0,0,.82)';
  document.getElementById('fpb').style.borderColor=m==='fp'?'#ffd700':'rgba(212,175,55,.28)';
  document.getElementById('tpb').style.background=m==='tp'?'rgba(212,175,55,.18)':'rgba(0,0,0,.82)';
  document.getElementById('tpb').style.borderColor=m==='tp'?'#ffd700':'rgba(212,175,55,.28)';
  document.getElementById('xh').style.display=m==='fp'?'block':'none';
}

// ── MAIN LOOP ─────────────────────────────────────────────────
function animate(){
  requestAnimationFrame(animate);
  const dt=Math.min(clock.getDelta(),.05), t=clock.getElapsedTime();
  const moving=updateMovement(dt);
  if(pov==='tp') updateTPCam();
  updateAvatar(t,moving);
  checkZone(t); drawMM();
  orbRings.forEach(r=>{ r.m.rotation.x+=r.spd; r.m.rotation.z+=r.spd*.65; });
  spinners.forEach(s=>s.m.rotation.y+=s.spd);
  pillarGlow.forEach(p=>{ p.m.material.emissiveIntensity=p.base+Math.sin(t*1.7+p.ph)*.28; });
  if(catBeam) catBeam.material.opacity=.12+Math.sin(t*2.2)*.05;
  if(driftAttr){ for(let i=0;i<driftN;i++){ driftAttr.array[i*3+1]+=.024; if(driftAttr.array[i*3+1]>80) driftAttr.array[i*3+1]=-3; } driftAttr.needsUpdate=true; }
  renderer.render(scene,cam);
}
