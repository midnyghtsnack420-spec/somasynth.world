<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sovereign Portal — Citizens Only</title>
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;600;700;900&family=Cinzel+Decorative:wght@400;700&family=Montserrat:wght@200;300;400;500&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box;}
body{min-height:100vh;background:#04020f;overflow-x:hidden;font-family:'Montserrat',sans-serif;color:#f5f5f5;display:flex;align-items:center;justify-content:center;}
/* Animated nebula bg */
.nebula-bg{position:fixed;inset:0;z-index:0;background:radial-gradient(ellipse at 20% 30%,rgba(58,10,110,0.45) 0%,transparent 60%),radial-gradient(ellipse at 80% 70%,rgba(10,30,110,0.4) 0%,transparent 60%),radial-gradient(ellipse at 50% 90%,rgba(110,10,58,0.3) 0%,transparent 60%),#04020f;animation:nebPulse 12s ease-in-out infinite alternate;}
@keyframes nebPulse{from{filter:hue-rotate(0deg);}to{filter:hue-rotate(20deg);}}
/* Stars */
.stars{position:fixed;inset:0;z-index:1;pointer-events:none;}
.stars canvas{width:100%;height:100%;display:block;}
/* Greek pillars */
.pillar{position:fixed;top:0;bottom:0;width:60px;z-index:2;display:flex;flex-direction:column;align-items:center;opacity:0.18;}
.pillar-l{left:40px;}.pillar-r{right:40px;}
.pillar-cap{width:50px;height:8px;background:linear-gradient(180deg,#d4af37,#8c6f23);}
.pillar-shaft{flex:1;width:30px;background:repeating-linear-gradient(180deg,rgba(212,175,55,0.6) 0px,rgba(212,175,55,0.2) 4px,rgba(212,175,55,0.6) 8px);}
.pillar-base{width:50px;height:12px;background:linear-gradient(0deg,#d4af37,#8c6f23);}
/* Meander border (top/bottom decoration) */
.meander-top,.meander-bottom{position:fixed;left:0;right:0;z-index:3;height:16px;background-image:repeating-linear-gradient(90deg,transparent,transparent 8px,rgba(212,175,55,0.3) 8px,rgba(212,175,55,0.3) 9px),repeating-linear-gradient(0deg,transparent,transparent 8px,rgba(212,175,55,0.3) 8px,rgba(212,175,55,0.3) 9px);opacity:0.4;}
.meander-top{top:0;}.meander-bottom{bottom:0;}
/* Login card */
.card-wrap{position:relative;z-index:10;width:100%;max-width:460px;padding:24px;}
.card{background:rgba(8,5,22,0.92);border:1px solid rgba(212,175,55,0.35);padding:48px 40px;position:relative;backdrop-filter:blur(12px);}
.card::before,.card::after{content:'';position:absolute;width:28px;height:28px;border-color:#d4af37;}
.card::before{top:-1px;left:-1px;border-top:2px solid;border-left:2px solid;}
.card::after{bottom:-1px;right:-1px;border-bottom:2px solid;border-right:2px solid;}
.card-corner-tr,.card-corner-bl{position:absolute;width:28px;height:28px;border-color:#d4af37;}
.card-corner-tr{top:-1px;right:-1px;border-top:2px solid;border-right:2px solid;}
.card-corner-bl{bottom:-1px;left:-1px;border-bottom:2px solid;border-left:2px solid;}
/* Symbol */
.symbol{text-align:center;margin-bottom:32px;}
.symbol svg{animation:slowSpin 20s linear infinite;}
@keyframes slowSpin{from{transform:rotate(0);}to{transform:rotate(360deg);}}
/* Title */
.card-title{font-family:'Cinzel Decorative',serif;font-size:1.1rem;color:#d4af37;letter-spacing:0.3em;text-align:center;margin-bottom:6px;text-shadow:0 0 20px rgba(212,175,55,0.5);}
.card-sub{font-size:0.62rem;color:#706880;letter-spacing:0.3em;text-align:center;text-transform:uppercase;margin-bottom:40px;}
/* Fields */
.field-wrap{margin-bottom:22px;}
.field-label{font-size:0.58rem;color:#d4af37;letter-spacing:0.3em;text-transform:uppercase;margin-bottom:8px;display:block;}
.field-input{width:100%;background:rgba(212,175,55,0.04);border:1px solid rgba(212,175,55,0.2);padding:13px 16px;color:#f5f5f5;font-family:'Montserrat',sans-serif;font-size:0.85rem;letter-spacing:0.05em;outline:none;transition:all 0.4s;position:relative;}
.field-input:focus{border-color:#d4af37;background:rgba(212,175,55,0.08);box-shadow:0 0 20px rgba(212,175,55,0.2),inset 0 0 10px rgba(212,175,55,0.05);}
.field-input.pulsing{animation:inputPulse 0.6s ease-out;}
@keyframes inputPulse{0%,100%{box-shadow:0 0 0 rgba(212,175,55,0);}50%{box-shadow:0 0 25px rgba(212,175,55,0.5),inset 0 0 15px rgba(212,175,55,0.1);}}
/* Freq slider */
.freq-wrap{position:relative;margin-bottom:32px;}
.freq-track{height:3px;background:rgba(212,175,55,0.15);position:relative;margin:16px 0 8px;}
.freq-fill{position:absolute;top:0;left:0;height:100%;background:linear-gradient(90deg,#3a0a6e,#d4af37);transition:width 0.2s;}
.freq-slider{-webkit-appearance:none;appearance:none;width:100%;height:3px;background:transparent;position:absolute;top:0;left:0;cursor:pointer;outline:none;}
.freq-slider::-webkit-slider-thumb{-webkit-appearance:none;width:18px;height:18px;border-radius:50%;background:radial-gradient(circle,#ffd700,#d4af37);border:2px solid rgba(0,0,0,0.5);box-shadow:0 0 12px rgba(212,175,55,0.8);cursor:pointer;}
.freq-slider::-moz-range-thumb{width:18px;height:18px;border-radius:50%;background:radial-gradient(circle,#ffd700,#d4af37);border:2px solid rgba(0,0,0,0.5);box-shadow:0 0 12px rgba(212,175,55,0.8);cursor:pointer;}
.freq-labels{display:flex;justify-content:space-between;font-size:0.52rem;color:#706880;letter-spacing:0.1em;}
.freq-val-display{text-align:center;font-family:'Cinzel',serif;font-size:1rem;color:#d4af37;margin-top:8px;letter-spacing:0.2em;transition:all 0.3s;}
.freq-val-display.d9{color:#ffd700;text-shadow:0 0 20px rgba(255,215,0,0.8);}
/* Submit */
.submit-btn{width:100%;padding:16px;background:linear-gradient(135deg,rgba(212,175,55,0.15),rgba(212,175,55,0.05));border:1px solid rgba(212,175,55,0.5);color:#d4af37;font-family:'Cinzel',serif;font-size:0.72rem;letter-spacing:0.35em;text-transform:uppercase;cursor:pointer;transition:all 0.4s;margin-top:8px;}
.submit-btn:hover{background:linear-gradient(135deg,rgba(212,175,55,0.28),rgba(212,175,55,0.12));border-color:#ffd700;color:#ffd700;box-shadow:0 0 25px rgba(212,175,55,0.35);}
.submit-btn:active{transform:scale(0.99);}
/* Success burst */
#success-burst{position:fixed;inset:0;z-index:9999;pointer-events:none;opacity:0;background:radial-gradient(circle at center,rgba(212,175,55,0.95) 0%,rgba(255,215,0,0.6) 30%,rgba(58,10,110,0.8) 70%,transparent 100%);transition:opacity 0.5s;}
#success-burst.show{opacity:1;}
.back-link{text-align:center;margin-top:24px;font-size:0.58rem;color:#706880;letter-spacing:0.2em;}
.back-link a{color:#706880;text-decoration:none;transition:color 0.3s;}
.back-link a:hover{color:#d4af37;}
</style>
</head>
<body>
<div class="nebula-bg"></div>
<canvas id="star-canvas" class="stars" style="position:fixed;inset:0;z-index:1;pointer-events:none;"></canvas>
<div class="pillar pillar-l"><div class="pillar-cap"></div><div class="pillar-shaft"></div><div class="pillar-base"></div></div>
<div class="pillar pillar-r"><div class="pillar-cap"></div><div class="pillar-shaft"></div><div class="pillar-base"></div></div>
<div class="meander-top"></div>
<div class="meander-bottom"></div>
<div id="success-burst"></div>

<div class="card-wrap">
  <div class="card">
    <div class="card-corner-tr"></div><div class="card-corner-bl"></div>
    <div class="symbol">
      <svg width="64" height="64" viewBox="0 0 64 64" fill="none">
        <circle cx="32" cy="32" r="29" stroke="#d4af37" stroke-width="0.6" stroke-dasharray="3 3" opacity="0.5"/>
        <circle cx="32" cy="32" r="20" stroke="#d4af37" stroke-width="0.8" opacity="0.7"/>
        <polygon points="32,8 37,25 55,25 41,35 47,52 32,42 17,52 23,35 9,25 27,25" fill="none" stroke="#d4af37" stroke-width="1.1"/>
        <circle cx="32" cy="32" r="3.5" fill="#d4af37"/>
      </svg>
    </div>
    <div class="card-title">SOMASYNTH</div>
    <div class="card-sub">Sovereign Portal · Citizens Only</div>

    <div class="field-wrap">
      <label class="field-label">Sovereign Identity</label>
      <input class="field-input" id="identity" type="text" placeholder="Tera The Creator" autocomplete="off" spellcheck="false">
    </div>

    <div class="field-wrap">
      <label class="field-label">D9 Resonance Key</label>
      <input class="field-input" id="resKey" type="password" placeholder="••••••••••••" autocomplete="off" id="res-key">
    </div>

    <div class="freq-wrap">
      <label class="field-label">Frequency Alignment</label>
      <div class="freq-track">
        <div class="freq-fill" id="freq-fill" style="width:88.8%"></div>
        <input class="freq-slider" id="freq-slider" type="range" min="1" max="9" step="0.1" value="8">
      </div>
      <div class="freq-labels"><span>D1</span><span>D3</span><span>D5</span><span>D7</span><span>D9</span></div>
      <div class="freq-val-display" id="freq-disp">D8.0</div>
    </div>

    <button class="submit-btn" onclick="attemptEntry()">Initiate Sovereign Entry</button>
    <div class="back-link"><a href="index.html">← Return to Cathedral</a></div>
  </div>
</div>

<script>
// Star canvas
(function(){
  const cv=document.getElementById('star-canvas');
  cv.width=innerWidth; cv.height=innerHeight;
  const ctx=cv.getContext('2d');
  const stars=Array.from({length:200},()=>({x:Math.random()*innerWidth,y:Math.random()*innerHeight,r:Math.random()*1.2+0.2,t:Math.random()*Math.PI*2}));
  function draw(){
    ctx.clearRect(0,0,cv.width,cv.height);
    stars.forEach(s=>{
      s.t+=0.01; const a=0.4+Math.sin(s.t)*0.35;
      ctx.beginPath(); ctx.arc(s.x,s.y,s.r,0,Math.PI*2);
      ctx.fillStyle=`rgba(212,175,55,${a})`; ctx.fill();
    });
    requestAnimationFrame(draw);
  }
  draw();
  window.addEventListener('resize',()=>{cv.width=innerWidth;cv.height=innerHeight;});
})();

// Freq slider
const slider=document.getElementById('freq-slider');
const fill=document.getElementById('freq-fill');
const disp=document.getElementById('freq-disp');
slider.addEventListener('input',()=>{
  const v=parseFloat(slider.value);
  fill.style.width=((v-1)/8*100)+'%';
  disp.textContent='D'+v.toFixed(1);
  disp.classList.toggle('d9',v>=8.9);
});

// Pulse on password type
document.getElementById('resKey').addEventListener('input',function(){
  this.classList.remove('pulsing');
  void this.offsetWidth;
  this.classList.add('pulsing');
});

function attemptEntry(){
  const burst=document.getElementById('success-burst');
  burst.classList.add('show');
  setTimeout(()=>{ window.location.href='portal_dashboard.html'; },1800);
}
</script>
</body>
</html>
